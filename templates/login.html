<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuadroAI Pro — Login</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-box{width:min(400px,100%);background:var(--sf);border:1px solid var(--bd2);border-radius:var(--rl);padding:40px 36px;display:flex;flex-direction:column;gap:20px}
.login-logo{font-family:"DM Serif Display",serif;font-size:28px;color:var(--tx);text-align:center}
.login-logo span{color:var(--gold-l)}
.login-sub{font-size:13px;color:var(--t3);text-align:center;margin-top:-12px}
.login-field{display:flex;flex-direction:column;gap:6px}
.login-field label{font-size:11px;font-weight:600;color:var(--t2);letter-spacing:.05em;text-transform:uppercase}
.login-field input{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);padding:10px 14px;font-size:14px;color:var(--tx);font-family:inherit;outline:none;transition:border-color .15s}
.login-field input:focus{border-color:var(--gold-bd)}
.login-btn{width:100%;min-height:44px;border-radius:var(--r);border:none;background:var(--gold);color:#000;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.85}
.login-err{font-size:12px;color:#e88;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">Quadro<span>AI</span> Pro</div>
    <div class="login-sub">Acesse sua conta</div>
    <div class="login-field">
      <label>Usuario</label>
      <input id="username" type="text" placeholder="seu usuario" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="login-err" id="loginErr"></div>
    <button class="login-btn" onclick="fazerLogin()">Entrar</button>
  </div>
</div>
<script>
document.addEventListener('keydown',function(e){if(e.key==='Enter') fazerLogin();});
async function fazerLogin(){
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value.trim();
  var err=document.getElementById('loginErr');
  err.textContent='';
  if(!u||!p){err.textContent='Preencha usuario e senha.';return;}
  try{
    var res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var data=await res.json();
    if(data.ok) window.location.href='/';
    else err.textContent=data.error||'Erro ao entrar.';
  }catch(e){err.textContent='Erro de conexao.';}
}
</script>
</body>
</html>
